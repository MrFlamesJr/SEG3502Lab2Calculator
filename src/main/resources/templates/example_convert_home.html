<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Temperature Calculator</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <div>
        <h1>Temperature Calculator</h1>

        <div th:switch="${error}">
            <p th:case="FahrenheitFormatError">
                Wrong value provided for Fahrenheit - must be a number
            </p>
            <p th:case="CelsiusFormatError">
                Wrong value provided for Celsius - must be a number
            </p>
            <p th:case="OperationFormatError">
                Wrong operation
            </p>
        </div>

        <form th:action="@{/calculate}" method="get">
            <table>
                <tr>
                    <td><label for="celsius">Celsius</label></td>
                    <td><input name="celsius" id="celsius" th:value="${celsius}" /></td>
                </tr>
                <tr>
                    <td><label for="fahrenheit">Fahrenheit</label></td>
                    <td><input name="fahrenheit" id="fahrenheit" th:value="${fahrenheit}" /></td>
                </tr>
                <tr>
                    <td><button type="submit" name="operation" value="CtoF">
                        Celsius to Fahrenheit</button></td>
                    <td><button type="submit" name="operation" value="FtoC">
                        Fahrenheit to Celsius</button></td>
                </tr>
            </table>
        </form>
    </div>
</body>

</html>
